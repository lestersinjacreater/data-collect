name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (redaction and CSV rules)
        run: ./gradlew :redactor:test

      - name: Build debug APK
        env:
          # Optional repo secret. Without it the APK uses a dev salt.
          DONATION_SALT: ${{ secrets.DONATION_SALT }}
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sms-donate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Rolling release so teammates can download the APK on their phones.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sms-donate.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sms-donate.apk --title "Latest build" --notes "Debug APK built from main (${GITHUB_SHA::7})." --prerelease
